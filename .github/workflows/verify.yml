name: Verify Library

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT and jq
        run: sudo apt-get update && sudo apt-get install -y luajit jq
      - name: Validate library manifest
        run: sed 's|// x-release-please-version||' lib.json | jq empty
      - name: Compile Lua source
        run: luajit -e 'assert(loadfile("lib.lua"))'
